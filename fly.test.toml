# Test instance: https://test.directuscantica.cz  (deploy: fly deploy -c fly.test.toml)
# Create once:  fly apps create directus-cantica-test
#               fly volumes create cantica_test_data --app directus-cantica-test --region ams --size 1
#               fly secrets set --app directus-cantica-test SECRET_KEY=...
#               fly certs add test.directuscantica.cz --app directus-cantica-test

app = 'directus-cantica-test'
primary_region = 'ams'
console_command = 'gosu appuser python /app/manage.py shell'

[build]

[env]
  CANTICA_ENV = 'production'
  DATABASE_PATH = '/data/cantica.sqlite3'
  ALLOWED_HOSTS = 'test.directuscantica.cz,directus-cantica-test.fly.dev'

[mounts]
  source = 'cantica_test_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    path = '/live'
    timeout = '5s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
