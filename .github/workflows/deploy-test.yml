# Deploy any branch to https://test.directuscantica.cz (manual).
name: Deploy test instance

on:
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    concurrency: deploy-test
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only -c fly.test.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_TEST }}  # deploy token for directus-cantica-test
