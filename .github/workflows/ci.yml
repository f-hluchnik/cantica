name: CI

on:
  push:
    branches-ignore: [main]  # main is tested by fly-deploy.yml, which calls this workflow
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test tests
      - name: Calendar data is consistent
        run: |
          python manage.py calendar_catalog
          python manage.py calendar_build --check
      - name: Rules lint
        run: python manage.py rules_lint --file
